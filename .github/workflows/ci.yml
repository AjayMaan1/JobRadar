name: ci
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar
          POSTGRES_DB: jobradar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobradar" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://jobradar:jobradar@localhost:5432/jobradar
      REDIS_URL: redis://localhost:6379
      STORAGE_SIGNING_SECRET: ci-signing-secret-0123456789
      LLM_PROVIDER: none
      EMBEDDING_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      # Schema ↔ migrations drift: a schema.prisma edit without a migration fails here.
      - run: npx prisma migrate diff --from-migrations packages/db/prisma/migrations --to-schema-datamodel packages/db/prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code
      # Backlog C0-2: a parse/type error anywhere (e.g. the v2 scheduler corruption) fails the build.
      - run: pnpm -r --if-present typecheck
      # Unit + integration (services tests run against the Postgres service) + worker boot smoke test.
      - run: pnpm test
      - run: pnpm --filter @jobradar/web build
      # Offline harness (audit NEW-19): the no-network verification path must keep working too (incl. the
      # browser-extension E2E, which loads the real unpacked extension into headless Chromium).
      - run: npx playwright install --with-deps chromium
      - run: tools/sandbox-e2e/run-all.sh
      # Audit NEW-02: a backup that cannot be restored is not a backup — back up the migrated DB, restore into a scratch DB, migrate.
      - name: restore drill
        run: |
          sudo apt-get install -y -q postgresql-client >/dev/null
          psql "$DATABASE_URL" -c "insert into users (id,email,role,created_at) values ('drill','drill@ci.local','admin',now())"
          BACKUP_DIR=/tmp/bk BACKUP_PASSPHRASE=ci tools/backup/backup.sh
          psql "$DATABASE_URL" -c "create database drill"
          BACKUP_PASSPHRASE=ci tools/backup/restore.sh "$(ls -d /tmp/bk/*/* | head -1)" --db postgresql://jobradar:jobradar@localhost:5432/drill --objects /tmp/drill-objects
          DATABASE_URL=postgresql://jobradar:jobradar@localhost:5432/drill npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma
          test "$(psql -At postgresql://jobradar:jobradar@localhost:5432/drill -c "select count(*) from users where id='drill'")" = "1"

  images:
    # Container images build (audit NEW-17). Not a release step — just proves the Dockerfiles stay valid.
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f Dockerfile.web -t jobradar-web:ci .
      - run: docker build -f Dockerfile.worker -t jobradar-worker:ci .
