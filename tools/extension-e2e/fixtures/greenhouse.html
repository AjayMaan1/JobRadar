<!doctype html><html><head><title>Acme — Senior Backend Engineer</title></head><body>
<h1>Senior Backend Engineer</h1>
<form id="application_form" action="/submitted" method="post">
  <div class="field"><label for="first_name">First Name <span>*</span></label><input id="first_name" name="job_application[first_name]" type="text"></div>
  <div class="field"><label for="last_name">Last Name <span>*</span></label><input id="last_name" name="job_application[last_name]" type="text"></div>
  <div class="field"><label for="email">Email <span>*</span></label><input id="email" name="job_application[email]" type="email"></div>
  <div class="field"><label for="phone">Phone</label><input id="phone" name="job_application[phone]" type="tel"></div>
  <div class="field"><label for="job_application_location">Location (City)</label><input id="job_application_location" name="job_application[location]" type="text"></div>
  <div class="field"><label for="resume">Resume/CV <span>*</span></label><input id="resume" name="job_application[resume]" type="file" accept=".pdf,.doc,.docx"></div>
  <div class="field"><label for="cover_letter_text">Cover Letter</label><textarea id="cover_letter_text" name="job_application[cover_letter_text]"></textarea></div>
  <div class="field application-question"><label for="question_1">LinkedIn Profile</label><input id="question_1" name="job_application[answers_attributes][0][text_value]" type="text"></div>
  <div class="field application-question"><label for="question_2">Why do you want to work at Acme?</label><textarea id="question_2" name="job_application[answers_attributes][1][text_value]"></textarea></div>
  <div class="field application-question"><label for="question_3">What is your notice period?</label><input id="question_3" name="job_application[answers_attributes][2][text_value]" type="text"></div>
  <div class="field application-question"><label for="question_4">Are you legally authorized to work in India?</label><select id="question_4" name="job_application[answers_attributes][3][boolean_value]"><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select></div>
  <input id="submit_app" type="submit" value="Submit Application">
</form>
<script>window.__submits = 0; document.getElementById('application_form').addEventListener('submit', (e) => { e.preventDefault(); window.__submits++ })</script>
</body></html>
