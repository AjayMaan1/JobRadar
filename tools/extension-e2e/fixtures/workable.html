<!doctype html><html><head><title>Acme — SRE</title></head><body>
<form data-ui="application-form" action="/submitted" method="post">
  <div class="form-group"><label for="firstname">First name *</label><input id="firstname" name="firstname" type="text"></div>
  <div class="form-group"><label for="lastname">Last name *</label><input id="lastname" name="lastname" type="text"></div>
  <div class="form-group"><label for="email">Email *</label><input id="email" name="email" type="email"></div>
  <div class="form-group"><label for="phone">Phone *</label><input id="phone" name="phone" type="tel"></div>
  <div class="form-group"><label for="address">Address</label><input id="address" name="address" type="text"></div>
  <div class="form-group"><label for="resume">Resume *</label><input id="resume" name="resume" type="file"></div>
  <div class="form-group"><label for="cover_letter">Cover letter</label><textarea id="cover_letter" name="cover_letter"></textarea></div>
  <div class="form-group"><label for="summary">Summary</label><textarea id="summary" name="summary"></textarea></div>
  <button type="submit">Submit application</button>
</form>
<script>window.__submits = 0; document.querySelector('form').addEventListener('submit', (e) => { e.preventDefault(); window.__submits++ })</script>
</body></html>
