<!doctype html>
<html><head><meta charset="utf-8"><title>JobRadar Autofill — options</title>
<style>
  body { max-width: 560px; margin: 24px auto; font: 14px system-ui, sans-serif; color: #111827; padding: 0 16px; }
  label { display: block; margin-top: 12px; font-size: 12px; color: #6b7280; }
  input { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 12px; padding: 8px 14px; border-radius: 6px; border: 1px solid #111827; background: #111827; color: #fff; font: inherit; cursor: pointer; }
  .ok { color: #047857; } .err { color: #b91c1c; } .muted { color: #6b7280; font-size: 12px; }
</style></head>
<body>
<h2>JobRadar Autofill</h2>
<p class="muted">1. In JobRadar open <b>Profile → Account &amp; alerts → Browser extension</b> and create a pairing token.<br>2. Paste the JobRadar URL and the token here. The token is stored only in this browser (never synced).</p>
<label>JobRadar URL <input id="baseUrl" placeholder="http://localhost:3000"></label>
<label>Pairing token <input id="token" type="password" placeholder="paste the token shown once in JobRadar"></label>
<button id="save">Save &amp; test connection</button>
<p id="msg"></p>
<script type="module" src="src/options.js"></script>
</body></html>
